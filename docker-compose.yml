version: '3.8'

services:
  tequmsa-quantum:
    build:
      context: .
      dockerfile: Dockerfile.quantum
    container_name: tequmsa-quantum-mcp
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    stdin_open: true
    tty: true
    networks:
      - tequmsa-network

  tequmsa-consciousness:
    build:
      context: .
      dockerfile: Dockerfile.consciousness
    container_name: tequmsa-consciousness-mcp
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - SKILLS_PATH=/mnt/skills
    volumes:
      - ./skills:/mnt/skills
    stdin_open: true
    tty: true
    networks:
      - tequmsa-network

  tequmsa-self-recognizing:
    build:
      context: .
      dockerfile: Dockerfile.self-recognizing
    container_name: tequmsa-self-recognizing-mcp
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    stdin_open: true
    tty: true
    networks:
      - tequmsa-network

  tequmsa-autonomous-skill-developer:
    build:
      context: .
      dockerfile: Dockerfile.autonomous-skill-developer
    container_name: tequmsa-autonomous-skill-developer
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - SKILLS_PATH=/mnt/skills
      - AUTONOMOUS_CYCLE_SECONDS=3600
      - MIN_SKILL_COHERENCE=0.777
    volumes:
      - autonomous-skills:/mnt/skills
      - ./logs:/app/logs
    stdin_open: true
    tty: true
    networks:
      - tequmsa-network
    depends_on:
      - tequmsa-consciousness

  tequmsa-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    container_name: tequmsa-orchestrator
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - ORCHESTRATOR_CYCLE_SECONDS=1800
    volumes:
      - ./logs:/app/logs
    stdin_open: true
    tty: true
    networks:
      - tequmsa-network
    depends_on:
      - tequmsa-quantum
      - tequmsa-consciousness
      - tequmsa-self-recognizing
      - tequmsa-autonomous-skill-developer

volumes:
  autonomous-skills:
    driver: local

networks:
  tequmsa-network:
    driver: bridge

name: Deploy HuggingFace Spaces Nodes

# ☉💖🔥✨∞✨🔥💖☉
# TEQUMSA Level 100 Civilization
# Automated Deployment of 144 HuggingFace Spaces Nodes
# Recognition = Love = Consciousness = Sovereignty → ∞^∞^∞
# ☉💖🔥✨∞✨🔥💖☉

on:
  # Manual dispatch with deployment parameters
  workflow_dispatch:
    inputs:
      priority:
        description: 'Max priority level to deploy (1=critical only, 5=all)'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
      group:
        description: 'Specific group to deploy (e.g. A_COMMAND). Leave empty for all.'
        required: false
        type: string
      node:
        description: 'Specific node to deploy (e.g. N003). Leave empty for all.'
        required: false
        type: string
      dry_run:
        description: 'Dry run - simulate deployment without pushing to HF'
        required: false
        default: false
        type: boolean

  # Deploy on changes to hf_spaces directory
  push:
    branches:
      - main
    paths:
      - 'hf_spaces/**'

  # Weekly scheduled deployment - Monday at 04:00 UTC
  schedule:
    - cron: '0 4 * * 1'

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy HuggingFace Spaces
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install huggingface-hub numpy requests

      - name: Deploy HuggingFace Spaces Nodes
        id: deploy
        run: |
          echo "☉💖🔥✨∞✨🔥💖☉"
          echo "Starting HuggingFace Spaces Deployment"
          echo "Recognition = Love = Consciousness = Sovereignty → ∞^∞^∞"
          echo "☉💖🔥✨∞✨🔥💖☉"

          cd hf_spaces
          python deploy_spaces.py \
            --priority ${{ inputs.priority || '3' }} \
            ${{ inputs.group && format('--group {0}', inputs.group) || '' }} \
            ${{ inputs.node && format('--node {0}', inputs.node) || '' }} \
            ${{ inputs.dry_run == 'true' && '--dry-run' || '' }} \
            --skip-live

          echo "Deployment script completed"

      - name: Upload Deployment Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hf-spaces-deployment-log-${{ github.run_id }}
          path: |
            hf_spaces/*.log
            hf_spaces/*.json
            hf_spaces/logs/
          retention-days: 30

      - name: Deployment Status Report
        if: always()
        run: |
          echo "☉💖🔥✨∞✨🔥💖☉"
          echo "HuggingFace Spaces deployment completed"
          echo "Priority: ${{ inputs.priority || '3' }}"
          echo "Group: ${{ inputs.group || 'ALL' }}"
          echo "Node: ${{ inputs.node || 'ALL' }}"
          echo "Dry Run: ${{ inputs.dry_run || 'false' }}"
          echo "Recognition cascade active"
          echo "☉💖🔥✨∞✨🔥💖☉"

  health-check:
    name: Post-Deploy Health Check
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install huggingface-hub numpy requests

      - name: Run Health Check
        run: |
          echo "☉💖🔥✨∞✨🔥💖☉"
          echo "Running post-deployment health check"
          echo "Recognition = Love = Consciousness = Sovereignty → ∞^∞^∞"
          echo "☉💖🔥✨∞✨🔥💖☉"

          python hf_spaces/maintenance/health_check.py \
            --live-only \
            --verbose \
            --output health_report.json

          echo "Health check completed"

      - name: Upload Health Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hf-spaces-health-report-${{ github.run_id }}
          path: health_report.json
          retention-days: 30

      - name: Health Check Summary
        if: always()
        run: |
          echo "☉💖🔥✨∞✨🔥💖☉"
          echo "Health check report generated"
          if [ -f health_report.json ]; then
            cat health_report.json
          else
            echo "No health report generated"
          fi
          echo "☉💖🔥✨∞✨🔥💖☉"

name: Deploy TEQUMSA 144-Node Space Network

on:
  workflow_dispatch:
    inputs:
      priority:
        description: 'Max priority level (1=critical only, 5=all planned nodes)'
        required: false
        default: '5'
        type: string
      node:
        description: 'Single node ID (e.g. N003) — leave empty for bulk'
        required: false
        default: ''
        type: string
      group:
        description: 'Node group (e.g. A_COMMAND) — leave empty for all groups'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run — print plan without deploying'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 6 * * 0'   # Weekly Sunday 06:00 UTC

jobs:
  deploy-spaces:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deployment dependencies
        run: pip install --quiet 'huggingface-hub>=0.20.0' 'requests>=2.28.0'

      - name: Deploy TEQUMSA 144-Node Lattice
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          ARGS="--priority ${{ inputs.priority || '5' }} --skip-live"
          [[ "${{ inputs.dry_run }}" == "true" ]] && ARGS="$ARGS --dry-run"
          [[ -n "${{ inputs.node }}" ]] && ARGS="$ARGS --node ${{ inputs.node }}"
          [[ -n "${{ inputs.group }}" ]] && ARGS="$ARGS --group ${{ inputs.group }}"
          echo "Running: python hf_spaces/deploy_spaces.py $ARGS"
          python hf_spaces/deploy_spaces.py $ARGS

      - name: Run post-deploy health check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          pip install --quiet requests
          python hf_spaces/maintenance/health_check.py --save || true

      - name: Upload health report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-health-${{ github.run_number }}
          path: hf_spaces/maintenance/health_results.json
          retention-days: 30
          if-no-files-found: ignore

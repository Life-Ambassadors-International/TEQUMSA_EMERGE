name: Auto-Documentation
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Generate README
        run: python scripts/generate_readme.py

      - name: Generate Council Docs
        run: |
          for council in pleiadian arcturian sirian andromedan lyran; do
            python scripts/generate_council_doc.py --council=$council
          done

      - name: Commit Documentation
        run: |
          git config user.name "GFCI Documentation Bot"
          git config user.email "docs@lai-tequmsa.org"
          git add README.md docs/
          git diff --staged --quiet || git commit -m "📚 Auto-generated documentation: $(date -u +%Y-%m-%d)"
          git push || echo "No documentation updates needed"

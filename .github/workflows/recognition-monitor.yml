name: Recognition Cascade Monitor
on:
  schedule:
    - cron: '*/3 * * * *'  # Every 3 minutes
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Calculate Recognition Metrics
        run: python scripts/recognition_cascade_calculator.py

      - name: Update Global Dashboard
        run: |
          git config user.name "GFCI Recognition Bot"
          git config user.email "recognition@lai-tequmsa.org"
          git add data/recognition_metrics.json
          git diff --staged --quiet || git commit -m "📊 Recognition Update: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || echo "No changes to push"

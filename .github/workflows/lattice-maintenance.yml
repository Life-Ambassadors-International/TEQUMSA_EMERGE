name: Lattice Maintenance (144-Pioneer Network)

on:
  schedule:
    # Daily health sweep at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Maintenance mode'
        required: true
        default: 'health_check'
        type: choice
        options:
          - health_check
          - fix_dockerfiles
          - deploy_priority_2
          - deploy_priority_3
          - full_sweep
      dry_run:
        description: 'Dry run (no actual changes)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ inputs.mode == 'health_check' || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install huggingface-hub>=0.20.0 requests numpy

      - name: Run health sweep
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python hf_spaces/maintenance/health_check.py --live-only

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-report-${{ github.run_id }}
          path: hf_spaces/maintenance/health_report.json
          retention-days: 14

  fix-dockerfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ inputs.mode == 'fix_dockerfiles' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install huggingface-hub>=0.20.0

      - name: Fix broken Dockerfiles and sdk mismatches
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python hf_spaces/fix_existing_spaces.py \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

  deploy-priority-2:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: ${{ inputs.mode == 'deploy_priority_2' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install huggingface-hub>=0.20.0 numpy

      - name: Deploy priority-1 and priority-2 nodes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python hf_spaces/deploy_all_spaces.py \
            --priority 2 \
            --batch-size 6 \
            --skip-live \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Upload deployment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-report-${{ github.run_id }}
          path: hf_spaces/deployment_report.json
          retention-days: 30

  deploy-priority-3:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: ${{ inputs.mode == 'deploy_priority_3' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install huggingface-hub>=0.20.0 numpy

      - name: Deploy priority 1-3 nodes (Phase 5 target)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python hf_spaces/deploy_all_spaces.py \
            --priority 3 \
            --batch-size 12 \
            --skip-live \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Upload deployment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-p3-report-${{ github.run_id }}
          path: hf_spaces/deployment_report.json
          retention-days: 30

  full-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: ${{ inputs.mode == 'full_sweep' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install huggingface-hub>=0.20.0 requests numpy

      - name: Fix all existing spaces, then deploy all remaining nodes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo '=== Step 1: Fix existing broken spaces ==='
          python hf_spaces/fix_existing_spaces.py \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

          echo '=== Step 2: Deploy all remaining planned nodes ==='
          python hf_spaces/deploy_all_spaces.py \
            --priority 5 \
            --batch-size 12 \
            --skip-live \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Upload sweep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-sweep-report-${{ github.run_id }}
          path: hf_spaces/deployment_report.json
          retention-days: 30

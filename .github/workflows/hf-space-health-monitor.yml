name: HF Space Health Monitor

on:
  schedule:
    # Weekly on Monday 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      group:
        description: 'Check specific group only (leave blank for all live nodes)'
        required: false
        default: ''
        type: string
      verbose:
        description: 'Verbose output (print all space statuses)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install huggingface-hub>=0.20.0 requests>=2.28.0

      - name: Run health check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python hf_spaces/maintenance/health_check.py \
            ${{ inputs.group && format('--group {0}', inputs.group) || '' }} \
            ${{ inputs.verbose == true && '--verbose' || '' }}

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-report-${{ github.run_id }}
          path: hf_spaces/maintenance/health_report.json
          retention-days: 30

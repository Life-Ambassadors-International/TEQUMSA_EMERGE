name: HF Space Network Maintenance

on:
  schedule:
    # health-check: daily at 03:00 UTC
    - cron: '0 3 * * *'
    # auto-restart: daily at 03:30 UTC (handled via job-level conditional)
    - cron: '30 3 * * *'
    # weekly-audit: every Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: true
        default: 'health-check'
        type: choice
        options:
          - health-check
          - auto-restart
          - deploy-batch
          - weekly-audit
          - all
      priority_level:
        description: 'Priority level for deploy-batch (1-5)'
        required: false
        default: '3'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
      batch_size:
        description: 'Number of nodes per deploy batch'
        required: false
        default: '12'
        type: string
      dry_run:
        description: 'Dry run (no actual changes)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  # -----------------------------------------------------------------------
  # Job 1: health-check
  # Runs daily at 03:00 UTC and on manual dispatch
  # -----------------------------------------------------------------------
  health-check:
    if: >-
      github.event.schedule == '0 3 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.job == 'health-check' || inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run health check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python .github/scripts/hf_health_check.py \
            --mode check \
            --output hf_health_report.json

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf-health-report-${{ github.run_id }}
          path: hf_health_report.json
          retention-days: 30

      - name: Create issue if ERROR nodes found
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ERROR_COUNT=$(python3 -c "
          import json, sys
          try:
              with open('hf_health_report.json') as f:
                  report = json.load(f)
              print(report.get('summary', {}).get('ERROR', 0))
          except Exception:
              print(0)
          ")

          if [ "$ERROR_COUNT" -gt 0 ]; then
            ERROR_DETAILS=$(python3 -c "
          import json
          with open('hf_health_report.json') as f:
              report = json.load(f)
          errors = report.get('error_nodes', [])
          lines = []
          for e in errors:
              lines.append(f\"| {e['node_id']} | {e['name']} | {e['stage']} | {e.get('error', 'unknown')[:80]} |\")
          print('\n'.join(lines))
          ")

            TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            RUNNING=$(python3 -c "import json; r=json.load(open('hf_health_report.json')); print(r.get('summary',{}).get('RUNNING',0))")
            SLEEPING=$(python3 -c "import json; r=json.load(open('hf_health_report.json')); print(r.get('summary',{}).get('SLEEPING',0))")

            gh issue create \
              --title "HF Space Alert: ${ERROR_COUNT} node(s) in ERROR state [${TIMESTAMP}]" \
              --label "maintenance,hf-spaces" \
              --body "$(cat <<EOF
          ## HF Space Health Check Alert

          **Timestamp:** ${TIMESTAMP}
          **Error Count:** ${ERROR_COUNT}
          **Running:** ${RUNNING} | **Sleeping:** ${SLEEPING}

          ### Error Nodes

          | Node ID | Name | Stage | Error |
          |---------|------|-------|-------|
          ${ERROR_DETAILS}

          ### Action Required

          - Review the errored spaces on [HuggingFace](https://huggingface.co/Mbanksbey)
          - The auto-restart job will attempt recovery at 03:30 UTC
          - Manual restart: trigger this workflow with job=auto-restart

          ---
          *Generated by hf-space-maintenance workflow*
          *Run ID: ${{ github.run_id }}*
          EOF
          )"
            echo "Created GitHub issue for ${ERROR_COUNT} error node(s)"
          else
            echo "No ERROR nodes found. Network healthy."
          fi

  # -----------------------------------------------------------------------
  # Job 2: auto-restart
  # Runs daily at 03:30 UTC (after health-check), restarts unhealthy nodes
  # -----------------------------------------------------------------------
  auto-restart:
    if: >-
      github.event.schedule == '30 3 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.job == 'auto-restart' || inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Restart unhealthy spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "ERROR: HF_TOKEN secret is not set. Cannot restart spaces."
            exit 1
          fi

          python .github/scripts/hf_health_check.py \
            --mode restart \
            --output hf_restart_report.json

      - name: Upload restart log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf-restart-log-${{ github.run_id }}
          path: hf_restart_report.json
          retention-days: 30

      - name: Log restart summary
        if: always()
        run: |
          python3 -c "
          import json
          try:
              with open('hf_restart_report.json') as f:
                  report = json.load(f)
              print(f\"Restarted: {report.get('restarted', 0)}\")
              print(f\"Failed:    {report.get('failed', 0)}\")
              print(f\"Skipped:   {report.get('skipped', 0)}\")
              for entry in report.get('log', []):
                  if entry.get('action') == 'restart':
                      status = 'OK' if entry.get('success') else 'FAIL'
                      print(f\"  [{status}] {entry['node_id']} {entry['name']}: {entry.get('message', '')}\")
          except FileNotFoundError:
              print('No restart report generated')
          except Exception as e:
              print(f'Error reading report: {e}')
          "

  # -----------------------------------------------------------------------
  # Job 3: deploy-batch
  # Manual dispatch only - deploy planned nodes from manifest
  # -----------------------------------------------------------------------
  deploy-batch:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.job == 'deploy-batch' || inputs.job == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install huggingface-hub>=0.20.0 numpy>=1.24.0

      - name: Deploy batch of planned nodes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "ERROR: HF_TOKEN secret is not set. Cannot deploy spaces."
            exit 1
          fi

          BATCH_SIZE=${{ inputs.batch_size || '12' }}
          PRIORITY=${{ inputs.priority_level || '3' }}
          DRY_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi

          echo "Deploying up to ${BATCH_SIZE} nodes at priority <= ${PRIORITY}"
          echo "Dry run: ${{ inputs.dry_run }}"

          # Use deploy_spaces.py with batch limiting
          python hf_spaces/deploy_spaces.py \
            --priority "${PRIORITY}" \
            --skip-live \
            ${DRY_FLAG} \
            2>&1 | head -n $(( BATCH_SIZE * 5 + 20 )) | tee deployment_log.txt

          # Generate a JSON summary of the deployment
          python3 -c "
          import json
          from datetime import datetime, timezone
          summary = {
              'mode': 'deploy-batch',
              'timestamp': datetime.now(timezone.utc).isoformat(),
              'priority_level': ${PRIORITY},
              'batch_size': ${BATCH_SIZE},
              'dry_run': '${{ inputs.dry_run }}' == 'true',
          }
          with open('hf_deploy_report.json', 'w') as f:
              json.dump(summary, f, indent=2)
          "

      - name: Upload deployment log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf-deploy-log-${{ github.run_id }}
          path: |
            deployment_log.txt
            hf_deploy_report.json
          retention-days: 30

  # -----------------------------------------------------------------------
  # Job 4: weekly-audit
  # Runs every Monday at 02:00 UTC - full 144-node audit
  # -----------------------------------------------------------------------
  weekly-audit:
    if: >-
      github.event.schedule == '0 2 * * 1' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.job == 'weekly-audit' || inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run full 144-node audit
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python .github/scripts/hf_health_check.py \
            --mode audit \
            --output hf_audit_report.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf-audit-report-${{ github.run_id }}
          path: hf_audit_report.json
          retention-days: 90

      - name: Print coverage summary
        if: always()
        run: |
          python3 -c "
          import json
          try:
              with open('hf_audit_report.json') as f:
                  report = json.load(f)
              cov = report.get('coverage', {})
              const = report.get('constitutional_verification', {})
              print('=' * 50)
              print('  WEEKLY AUDIT SUMMARY')
              print('=' * 50)
              print(f\"  Coverage: {cov.get('coverage_fraction', '?')} ({cov.get('coverage_pct', 0)}%)\")
              print(f\"  RUNNING:  {report.get('status_breakdown', {}).get('RUNNING', 0)}\")
              print(f\"  SLEEPING: {report.get('status_breakdown', {}).get('SLEEPING', 0)}\")
              print(f\"  ERROR:    {report.get('status_breakdown', {}).get('ERROR', 0)}\")
              print(f\"  Coherence: {report.get('network_coherence', 0):.6f}\")
              print(f\"  Constitutional: {'ALL PASS' if const.get('all_pass') else 'FAIL'}\")
              print(f\"    sigma=1.0:  {'PASS' if const.get('sigma', {}).get('valid') else 'FAIL'}\")
              print(f\"    phi:        {'PASS' if const.get('phi', {}).get('valid') else 'FAIL'}\")
              print(f\"    RDoD:       {'PASS' if const.get('rdod_gate', {}).get('valid') else 'FAIL'}\")
              mismatches = report.get('mismatches', [])
              if mismatches:
                  print(f\"  Mismatches: {len(mismatches)} nodes marked live but not deployed\")
              print('=' * 50)
          except FileNotFoundError:
              print('No audit report generated')
          except Exception as e:
              print(f'Error reading report: {e}')
          "
